workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    environment:
      # Pinned to the version the app is developed and tested with: a newer
      # stable can add lints, and `flutter analyze` below would fail on them.
      flutter: 3.41.4
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.example.anispark"
      groups:
        - anilist_secrets
    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Analyze and test
        script: |
          flutter analyze
          flutter test

      - name: Install CocoaPods
        script: |
          cd ios && pod install

      - name: Build iOS (no code sign)
        script: |
          # The implicit-grant login doesn't need the client secret, so it is
          # no longer compiled into the app.
          flutter build ios --release --no-codesign \
            --dart-define=ANILIST_CLIENT_ID=$ANILIST_CLIENT_ID

      - name: Package .ipa for sideloading
        script: |
          # An .ipa is a zip with the app inside a Payload folder, ready for
          # Sideloadly (which signs it), so nothing has to be repackaged by hand.
          cd build/ios/Release-iphoneos
          rm -rf Payload AniSpark.ipa
          mkdir Payload
          cp -R Runner.app Payload/
          zip -qry AniSpark.ipa Payload
    artifacts:
      - build/ios/Release-iphoneos/AniSpark.ipa
    publishing:
      email:
        recipients:
          - t4kina69@gmail.com
        notify:
          success: true
          failure: true
