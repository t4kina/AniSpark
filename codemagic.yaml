workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.example.anispark"
      groups:
        - anilist_secrets
    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios && pod install

      - name: Build iOS (no code sign)
        script: |
          flutter build ios --release --no-codesign \
            --dart-define=ANILIST_CLIENT_ID=$ANILIST_CLIENT_ID \
            --dart-define=ANILIST_CLIENT_SECRET=$ANILIST_CLIENT_SECRET

      - name: Zip app bundle
        script: |
          cd build/ios/Release-iphoneos
          zip -r AniSpark.zip Runner.app
    artifacts:
      - build/ios/Release-iphoneos/AniSpark.zip
    publishing:
      email:
        recipients:
          - t4kina69@gmail.com
        notify:
          success: true
          failure: true
