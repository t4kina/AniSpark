name: anispark
description: "An anime tracking app powered by AniList."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # Networking
  http: ^1.2.2

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # State Management
  provider: ^6.1.1

  # UI
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  cupertino_icons: ^1.0.8

  # OAuth & URL
  flutter_web_auth_2: ^5.0.1
  url_launcher: ^6.2.5

  # Cache
  flutter_cache_manager: ^3.3.1

  # Web APIs (replaces deprecated dart:html)
  web: ^1.1.0

  # SVG
  flutter_svg: ^2.0.17

  # Preferences
  shared_preferences: ^2.2.2

  # Confetti
  confetti: ^0.7.0

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.6
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.jpg"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpg
    - assets/bin.svg
    - assets/wifi.svg